baseURL = "https://go-ruby-shellwords.github.io/"
title = "go-ruby-shellwords"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "shellsplit"
  status = "ready"
  blurb = "POSIX `sh` word splitting honouring single quotes, double quotes and backslash escapes, exactly as Ruby's `Shellwords.shellsplit` does."
[[params.phases]]
  name = "shellescape"
  status = "ready"
  blurb = "Escaping a single string so it survives one round of shell parsing, byte-for-byte identical to MRI (including the empty-string `''` case)."
[[params.phases]]
  name = "shelljoin"
  status = "ready"
  blurb = "Joining an array of words into a single shell-safe command line, the inverse of `shellsplit`, matching reference Ruby."
[[params.phases]]
  name = "Error on malformed input"
  status = "ready"
  blurb = "An unmatched quote raises the same `ArgumentError` Ruby raises, at the same point in the input."
[[params.phases]]
  name = "Round-trip fidelity"
  status = "ready"
  blurb = "`shellsplit(shelljoin(words)) == words` over arbitrary words, the property reference Ruby guarantees."
[[params.phases]]
  name = "Differential oracle & coverage"
  status = "ready"
  blurb = "A wide word corpus split, escaped and joined both here and by the system `ruby`/`shellwords`, compared byte-for-byte; 100% coverage, gofmt + go vet clean, green across all six 64-bit Go arches and three OSes."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 10.02:1, bright on the dark background 4.00:1.
  base = "#7f1d1d"
  deep = "#4d1212"
  bright = "#dc2626"
  shadow = "rgba(127,29,29,.7)"
  glow = "rgba(127,29,29,.6)"
  wash = "rgba(127,29,29,.10)"
  washDeep = "rgba(77,18,18,.06)"
  chipBg = "#fbe5e5"
  chipBorder = "#f4bebe"
  chipFg = "#4d1212"
  chipBgDark = "rgba(220,38,38,.14)"
  chipBorderDark = "rgba(220,38,38,.32)"
  chipFgDark = "#ec8888"
  statsEnd = "#f7cbcb"
  bandText = "#f9dcdc"
